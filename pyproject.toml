[project]
name = "neural-spd-inversion"
version = "1.0.0"
description = "Data processing and analysis for Do neural networks think like geomoprhologists?"
readme = "README.md"
requires-python = "==3.11.*"
authors = [
        {name = "Jo Martin", email = "jo.martin@colorado.edu"}
]
dependencies = ["pooch",
                "numpy",
                "landlab",
                "torch",
                "pandas",
                "matplotlib",
                "seaborn",
                "scikit-learn",
                "landlab_torch_tools",
                "model_base",
                "cmcrameri"]

[project.optional-dependencies]
appendix = [
    "pygraphviz>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
landlab_torch_tools = { path = "./lib/landlab_torch_tools", editable = true }
model_base = { path = "./lib/model_base", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/neural_spd"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

