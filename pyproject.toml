[project]
name = "neural-spd-inversion"
version = "1.0.0"
description = "Data processing and analysis for Do neural networks think like geomoprhologists?"
readme = "README.md"
requires-python = ">3.12.2"
authors = [
        {name = "Jo Martin", email = "jo.martin@colorado.edu"}
]
dependencies = ["pooch",
                "numpy",
                "landlab",
                "pytorch",
                "pandas",
                "matplotlib",
                "seaborn",
                "scikit-learn",
                "landlab_torch_tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
landlab_torch_tools = { path = "./lib/landlab_torch_tools", editable = true }
